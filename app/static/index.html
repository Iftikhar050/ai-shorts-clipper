<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorts Clipper</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314b8a6'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></span>
        <span>Shorts Clipper</span>
      </a>
      <nav class="nav">
        <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 9h16M9 5v4"/></svg><span>Projects</span></a>
        <a href="#/accounts" data-nav="accounts"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5M16 7.5a2.8 2.8 0 010 5.4M18 19c-.3-1.8-1-3.1-2.1-4"/></svg><span>Accounts</span></a>
        <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg><span>Settings</span></a>
      </nav>
      <div class="sidebar-foot">
        <div id="health" class="health"></div>
        <button id="themeToggle" class="ghost small" type="button" title="Switch theme">Theme</button>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="drawer" class="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></section>
  </div>
  <div id="dropOverlay" class="drop-overlay" hidden><div>Drop your video to start</div></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/app.js" type="module"></script>
</body>
</html>
